# OBS-001, Passo 5 — provider apontando pra esta mesma pasta; o Grafana carrega
# qualquer .json de dashboard que estiver aqui dentro, sem clique na UI.
apiVersion: 1

providers:
  - name: "OBS-001"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
