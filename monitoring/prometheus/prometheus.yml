# OBS-001, Passo 4 — scrape real da API (substitui o self-scrape placeholder do Passo 3).
# "api" é o nome do serviço no docker-compose.yml, resolvido pelo DNS interno do Compose —
# "localhost" de dentro deste container apontaria para o próprio Prometheus, não para a API.
# 8000 é a porta que o Dockerfile expõe (EXPOSE 8000) e o uvicorn escuta dentro do container.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "clinical-triage-api"
    static_configs:
      - targets: ["api:8000"]
